<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>东北家常菜 · 雅集点菜谱</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap');
    :root {
      --bg-paper: #f6f3ec;
      --bg-card: #ffffff;
      --ink-main: #1c1917;
      --ink-muted: #78716c;
      --cinnabar: #c83e2b;
      --cinnabar-dark: #a62e1e;
      --cinnabar-soft: #fff5f2;
      --gold-accent: #b45309;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-paper);
      background-image: radial-gradient( rgba(180, 140, 100, 0.07) 1px, transparent 0 );
      background-size: 20px 20px;
      color: var(--ink-main);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-serif-cn {
      font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .dish-card {
      background: var(--bg-card);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    }
    @media (hover: hover) {
      .dish-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -8px rgba(28, 25, 23, 0.10), 0 4px 10px -4px rgba(28, 25, 23, 0.05);
      }
    }
    .dish-card:active { transform: scale(0.99); }
    .dish-selected {
      border-color: var(--cinnabar) !important;
      background: linear-gradient(180deg, #ffffff 0%, #fff8f6 100%) !important;
      box-shadow: 0 10px 26px -6px rgba(200, 62, 43, 0.18), 0 0 0 1px rgba(200, 62, 43, 0.25) !important;
    }
    .art-zoom img {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (hover: hover) {
      .dish-card:hover .art-zoom img {
        transform: scale(1.045);
      }
    }
    .toast-enter {
      animation: toastPop 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastPop {
      from { opacity: 0; transform: translate(-50%, 14px) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    .seal-badge {
      background: linear-gradient(135deg, #d64531 0%, #b32d1b 100%);
      box-shadow: 0 3px 10px rgba(185, 45, 27, 0.28), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .btn-cinnabar {
      background: linear-gradient(135deg, #d1432f 0%, #b52f1d 100%);
      box-shadow: 0 4px 14px -2px rgba(200, 62, 43, 0.38);
    }
    .btn-cinnabar:hover:not(:disabled) {
      background: linear-gradient(135deg, #bd3926 0%, #9e2616 100%);
    }
    .btn-cinnabar:disabled {
      background: #d6d3d1;
      box-shadow: none;
    }
  </style>
</head>
<body class="min-h-screen pb-32">

  <!-- Top Refined Sticky Header -->
  <header class="sticky top-0 z-30 bg-[#fbf9f5]/95 backdrop-blur-md border-b border-stone-200/80 shadow-[0_2px_16px_rgba(28,25,23,0.04)]">
    <div class="max-w-6xl mx-auto px-3 sm:px-6 pt-3 pb-2.5">
      <!-- Brand Title & Actions -->
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-xl seal-badge text-amber-50 flex flex-col items-center justify-center shrink-0 border border-red-800/20">
            <span class="font-serif-cn font-bold text-base leading-none">食味</span>
            <span class="text-[9px] tracking-widest opacity-85 mt-0.5">雅集</span>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h1 class="font-serif-cn text-base sm:text-xl font-bold text-stone-900 truncate tracking-tight">东北家常菜 · 墙面点菜谱</h1>
              <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100/80 text-amber-900 border border-amber-200/70">全墙实录 102 味</span>
            </div>
            <p id="headerStats" class="text-xs text-stone-500 truncate mt-0.5">收录全墙 102 道菜品 · 点完一键复制纯菜名（自动剔除价格）</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" id="openCustomModalBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white hover:bg-stone-100 text-stone-800 border border-stone-200/90 shadow-sm transition flex items-center gap-1">
            <span>+ 加主食/自选</span>
          </button>
        </div>
      </div>

      <!-- Search + Zone + Mode Controls -->
      <div class="flex flex-col md:flex-row gap-2">
        <div class="relative flex-1">
          <svg class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path stroke-linecap="round" d="m21 21-4.3-4.3"></path>
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="搜菜名、食材或拼音首字母（如：地三鲜 / dsx / 肘子 / 鱼 / 豆腐）"
            class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm bg-white border border-stone-200/90 focus:border-[#c83e2b] focus:ring-2 focus:ring-[#c83e2b]/15 focus:outline-none rounded-xl shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)] transition"
          />
          <button
            type="button"
            id="clearSearchBtn"
            aria-label="清空搜索"
            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-stone-300 text-white text-xs items-center justify-center hover:bg-stone-400"
          >×</button>
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <select
            id="zoneSelect"
            aria-label="按墙面位置筛选"
            class="text-xs sm:text-sm bg-white border border-stone-200/90 text-stone-700 font-medium rounded-xl px-2.5 py-2 focus:outline-none focus:border-[#c83e2b] shrink-0"
          >
            <option value="all">全部墙面区域 (102)</option>
            <option value="特色菜专区">特色菜+大公鸡 (11)</option>
            <option value="绿框主菜单">绿框家常主菜单 (30)</option>
            <option value="发光灯箱">发光灯箱墙·当前 (42)</option>
            <option value="门口凉菜主食">门口竖牌·凉菜主食 (10)</option>
            <option value="右侧单品海报">右侧单品贴画 (4)</option>
            <option value="旧版灯箱补充">旧版灯箱替换菜 (5)</option>
          </select>

          <button
            type="button"
            id="togglePricedBtn"
            class="px-2.5 py-2 rounded-xl text-xs font-medium border border-stone-200/90 bg-white text-stone-600 hover:bg-stone-50 whitespace-nowrap transition shrink-0"
          >只看有价</button>

          <button
            type="button"
            id="toggleImgBtn"
            class="px-2.5 py-2 rounded-xl text-xs font-semibold border border-[#c83e2b]/40 bg-[#fff5f2] text-[#b52f1d] whitespace-nowrap transition shrink-0"
          >配图开</button>
        </div>
      </div>

      <!-- Culinary Category Tabs -->
      <div id="categoryTabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-2.5 pb-0.5"></div>
    </div>
  </header>

  <!-- Main Menu Gallery -->
  <main class="max-w-6xl mx-auto px-3 sm:px-6 pt-3.5">
    <!-- Quick Staple & Dining Helper Strip -->
    <div class="mb-3.5 bg-white/90 backdrop-blur border border-stone-200/80 rounded-2xl px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-2 shadow-sm">
      <div class="flex items-center gap-1.5 flex-wrap text-xs">
        <span class="text-stone-500 font-semibold mr-0.5">主食常备：</span>
        <button type="button" data-quick-add="米饭" class="px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200/70 font-medium transition">+ 米饭</button>
        <button type="button" data-quick-add="大碴粥" class="px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200/70 font-medium transition">+ 大碴粥</button>
        <button type="button" data-quick-add="馒头" class="px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200/70 font-medium transition">+ 馒头</button>
        <button type="button" data-quick-add="餐具/打包盒" class="px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 font-medium transition">+ 打包盒</button>
      </div>
      <div id="balanceHintBar" class="text-[11px] text-stone-500 font-medium">
        点菜贴士：点选插画可放大鉴赏并加单品忌口；灯箱未标清项可点击补记实价
      </div>
    </div>

    <!-- Dish Grid -->
    <div id="dishGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></div>

    <!-- Empty Filter State -->
    <div id="emptyState" class="hidden py-20 text-center bg-white/70 rounded-3xl border border-stone-200/70 my-4">
      <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-amber-50 border border-amber-200/60 flex items-center justify-center text-2xl">🥢</div>
      <p class="font-serif-cn text-stone-800 font-bold text-base mb-1">未寻得匹配的菜肴</p>
      <p class="text-stone-500 text-xs mb-4">可重置筛选条件，或点击右上角“+ 加主食/自选”直接录入</p>
      <button type="button" id="resetFiltersBtn" class="px-4 py-2 rounded-xl bg-stone-900 text-white text-xs font-semibold hover:bg-stone-800 transition">
        重置筛选条件
      </button>
    </div>
  </main>

  <!-- Floating Refined Bottom Bar -->
  <div class="fixed bottom-0 inset-x-0 z-30 pointer-events-none pb-2 sm:pb-3 px-2.5 sm:px-6">
    <div class="max-w-5xl mx-auto bg-[#1c1917]/95 backdrop-blur-md text-stone-100 rounded-2xl sm:rounded-3xl shadow-[0_12px_36px_rgba(0,0,0,0.26)] border border-stone-700/70 px-3.5 sm:px-5 py-2.5 flex items-center justify-between gap-2.5 pointer-events-auto">
      <button
        type="button"
        id="openCartBtn"
        class="flex items-center gap-3 min-w-0 text-left group py-0.5"
      >
        <div class="relative w-11 h-11 rounded-2xl bg-stone-800 border border-stone-700 text-amber-100 flex items-center justify-center shrink-0 group-hover:bg-stone-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"></path>
          </svg>
          <span id="cartBadge" class="hidden absolute -top-1.5 -right-1.5 min-w-[21px] h-[21px] px-1 rounded-full bg-[#e04f3a] text-white text-[11px] font-bold items-center justify-center shadow">0</span>
        </div>
        <div class="min-w-0">
          <div id="cartSummaryTitle" class="text-sm font-bold text-white truncate">暂未点菜</div>
          <div id="cartSummarySub" class="text-[11px] sm:text-xs text-stone-400 truncate">轻触菜品卡片 + 号即可加入点菜单</div>
        </div>
      </button>

      <div class="flex items-center gap-2 shrink-0">
        <button
          type="button"
          id="openDrawerActionBtn"
          class="px-3 sm:px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-stone-800 hover:bg-stone-700 text-stone-200 border border-stone-700 transition"
        >已点明细</button>
        <button
          type="button"
          id="quickCopyBtn"
          class="px-3.5 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold btn-cinnabar text-white transition flex items-center gap-1.5"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>复制菜名</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Dish Detail & Large Artwork Preview Modal -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="detailModalBackdrop" class="absolute inset-0 bg-stone-950/60 backdrop-blur-[2px]"></div>
    <div class="relative bg-[#fbf9f5] rounded-3xl shadow-2xl w-full max-w-md overflow-hidden z-10 border border-stone-200">
      <button type="button" id="closeDetailModalBtn" aria-label="关闭详情" class="absolute top-3 right-3 z-20 w-8 h-8 rounded-full bg-black/45 hover:bg-black/65 text-white flex items-center justify-center text-lg leading-none backdrop-blur">×</button>
      <div id="detailArtBox" class="w-full aspect-[12/8] bg-stone-100 overflow-hidden border-b border-stone-200/80"></div>
      <div class="p-5">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div id="detailMetaBadges" class="flex items-center gap-1.5 flex-wrap mb-1.5"></div>
            <h3 id="detailDishTitle" class="font-serif-cn text-xl font-bold text-stone-900"></h3>
          </div>
          <div id="detailPriceArea" class="text-right shrink-0"></div>
        </div>

        <div class="mt-4 pt-3.5 border-t border-stone-200/80">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-semibold text-stone-600">单品口味备注（复制菜名时可选附带）</span>
            <div class="flex gap-1">
              <button type="button" data-detail-flavor="微辣" class="px-2 py-0.5 rounded-md bg-white border border-stone-200 text-[11px] text-stone-600 hover:border-[#c83e2b]">微辣</button>
              <button type="button" data-detail-flavor="免葱蒜" class="px-2 py-0.5 rounded-md bg-white border border-stone-200 text-[11px] text-stone-600 hover:border-[#c83e2b]">免葱蒜</button>
              <button type="button" data-detail-flavor="少盐" class="px-2 py-0.5 rounded-md bg-white border border-stone-200 text-[11px] text-stone-600 hover:border-[#c83e2b]">少盐</button>
            </div>
          </div>
          <input id="detailNoteInput" type="text" placeholder="例如：多加醋、不要香菜、先上..." class="w-full px-3 py-2 text-xs bg-white border border-stone-200 rounded-xl focus:outline-none focus:border-[#c83e2b]" />
        </div>

        <div class="mt-4 flex items-center justify-between gap-3">
          <button type="button" id="detailEditPriceBtn" class="px-3 py-2 rounded-xl text-xs font-medium bg-stone-200/70 hover:bg-stone-200 text-stone-700 transition">
            修改/补记单价
          </button>
          <div id="detailStepperBox" class="flex items-center gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart & Copy Preview Drawer Modal -->
  <div id="cartDrawer" class="hidden fixed inset-0 z-40">
    <div id="cartBackdrop" class="absolute inset-0 bg-stone-950/55 backdrop-blur-[2px]"></div>
    <div class="absolute inset-x-0 bottom-0 sm:inset-y-6 sm:max-w-xl sm:mx-auto bg-[#fbf9f5] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col max-h-[89vh] sm:max-h-[90vh] overflow-hidden border border-stone-200">
      <!-- Drawer Header -->
      <div class="px-4 sm:px-5 py-3.5 bg-white border-b border-stone-200/90 flex items-center justify-between">
        <div>
          <h2 class="font-serif-cn text-base sm:text-lg font-bold text-stone-900">已点菜单 & 纯菜名导出</h2>
          <p id="drawerSubHeader" class="text-xs text-stone-500">复制文本已自动过滤全部价格信息</p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" id="clearCartBtn" class="px-2.5 py-1 rounded-lg text-xs font-medium text-red-700 hover:bg-red-50 transition">
            清空已点
          </button>
          <button type="button" id="closeCartBtn" aria-label="关闭弹窗" class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 flex items-center justify-center text-lg leading-none">
            ×
          </button>
        </div>
      </div>

      <!-- Drawer Scrollable Body -->
      <div class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-4">
        <!-- Meal Structure Summary Pill -->
        <div id="drawerStructureBar" class="hidden bg-amber-50/90 border border-amber-200/80 rounded-2xl px-3.5 py-2 text-xs text-amber-950 font-medium"></div>

        <!-- Ordered Items List -->
        <div id="cartItemsList" class="space-y-2.5"></div>

        <!-- Overall Dining Note -->
        <div class="bg-white rounded-2xl p-3.5 border border-stone-200/80 shadow-sm">
          <div class="flex items-center justify-between mb-1.5 gap-2 flex-wrap">
            <label for="overallNoteInput" class="text-xs font-bold text-stone-700">整单忌口 / 用餐备注（可选）</label>
            <div class="flex gap-1 flex-wrap">
              <button type="button" data-overall-tag="微辣" class="px-2 py-0.5 rounded-md bg-stone-50 border border-stone-200 text-[11px] text-stone-600 hover:border-[#c83e2b]">微辣</button>
              <button type="button" data-overall-tag="少油少盐" class="px-2 py-0.5 rounded-md bg-stone-50 border border-stone-200 text-[11px] text-stone-600 hover:border-[#c83e2b]">少油少盐</button>
              <button type="button" data-overall-tag="免香菜" class="px-2 py-0.5 rounded-md bg-stone-50 border border-stone-200 text-[11px] text-stone-600 hover:border-[#c83e2b]">免香菜</button>
            </div>
          </div>
          <input
            id="overallNoteInput"
            type="text"
            placeholder="例如：不要香菜、先上凉菜、4人用餐..."
            class="w-full px-3 py-1.5 text-xs bg-stone-50 border border-stone-200 rounded-xl focus:bg-white focus:outline-none focus:border-[#c83e2b]"
          />
        </div>

        <!-- Copy Format Settings & Live Text Preview -->
        <div class="bg-white rounded-2xl p-3.5 border border-[#c83e2b]/25 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
            <span class="text-xs font-bold text-stone-800">复制排版格式（严格不含价格）</span>
            <div class="inline-flex rounded-xl bg-stone-100 p-0.5 border border-stone-200 text-xs">
              <button type="button" data-copy-fmt="lines" class="copy-fmt-btn px-2.5 py-1 rounded-lg font-medium transition">每行一菜</button>
              <button type="button" data-copy-fmt="inline" class="copy-fmt-btn px-2.5 py-1 rounded-lg font-medium transition">顿号单行</button>
              <button type="button" data-copy-fmt="numbered" class="copy-fmt-btn px-2.5 py-1 rounded-lg font-medium transition">带序号</button>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-4 mb-2.5 text-xs text-stone-700">
            <label class="inline-flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="includeQtyCheckbox" checked class="rounded text-[#c83e2b] focus:ring-[#c83e2b]" />
              <span>多份显示数量（如 ×2）</span>
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="includeNoteCheckbox" checked class="rounded text-[#c83e2b] focus:ring-[#c83e2b]" />
              <span>附带口味备注</span>
            </label>
          </div>

          <textarea
            id="copyPreviewArea"
            readonly
            rows="4"
            aria-label="复制菜名预览"
            class="w-full p-3 text-xs sm:text-sm bg-[#fbf9f5] border border-stone-200 rounded-xl text-stone-800 font-medium focus:outline-none resize-none leading-relaxed"
          ></textarea>
        </div>
      </div>

      <!-- Drawer Footer -->
      <div class="p-4 border-t border-stone-200 bg-white flex items-center justify-between gap-3">
        <div class="text-xs text-stone-600">
          <div>参考合计：<span id="drawerTotalAmount" class="text-lg font-bold text-stone-900">¥0</span></div>
          <div id="drawerUnpricedHint" class="text-[11px] text-amber-700"></div>
        </div>
        <button
          type="button"
          id="drawerCopyBtn"
          class="px-5 py-2.5 rounded-xl btn-cinnabar text-white text-sm font-bold transition flex items-center gap-1.5"
        >
          <span>一键复制菜名（不含价格）</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Custom Dish / Price Edit Modal -->
  <div id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="editModalBackdrop" class="absolute inset-0 bg-stone-950/55 backdrop-blur-[1px]"></div>
    <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-sm p-5 z-10 border border-stone-200">
      <h3 id="editModalTitle" class="font-serif-cn text-base font-bold text-stone-900 mb-3">添加自定义菜品 / 主食</h3>

      <div id="customDishFields" class="space-y-3">
        <div>
          <label for="customDishName" class="block text-xs font-medium text-stone-600 mb-1">菜品或主食名称 *</label>

          if (parsed.cart && typeof parsed.cart === 'object') state.cart = parsed.cart;
          if (Array.isArray(parsed.customDishes)) state.customDishes = parsed.customDishes;
          if (parsed.priceOverrides && typeof parsed.priceOverrides === 'object') state.priceOverrides = parsed.priceOverrides;
          if (['lines', 'inline', 'numbered'].includes(parsed.copyFormat)) state.copyFormat = parsed.copyFormat;
          if (typeof parsed.copyIncludeQty === 'boolean') state.copyIncludeQty = parsed.copyIncludeQty;
          if (typeof parsed.copyIncludeNotes === 'boolean') state.copyIncludeNotes = parsed.copyIncludeNotes;
          if (typeof parsed.overallNote === 'string') state.overallNote = parsed.overallNote;
          if (typeof parsed.showImages === 'boolean') state.showImages = parsed.showImages;
        }
      } catch (e) {}
    }

    function getDishPhotoUrl(dish) {
      if (PHOTO_MAP[dish.id]) return PHOTO_MAP[dish.id];
      const n = dish.name || '';
      if (/米饭/.test(n)) return PHOTO_MAP.qa_rice;
      if (/粥/.test(n)) return PHOTO_MAP.qa_porridge;
      if (/馒头|花卷|饼|主食/.test(n)) return PHOTO_MAP.qa_bun;
      if (/打包|餐具|盒/.test(n)) return PHOTO_MAP.qa_box;
      if (/啤|酒|饮|可乐|雪碧|水/.test(n)) return PHOTO_MAP.fb_drink;
      if (/拍黄瓜|凉|拌/.test(n)) return PHOTO_MAP.fb_cold;
      return PHOTO_MAP.fb_hot;
    }

    function renderDishSvg(dish) {
      const url = getDishPhotoUrl(dish);
      return `<img src="${url}" alt="${escapeHtml(dish.name)}" loading="lazy" decoding="async" class="w-full h-full object-cover block select-none" />`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getAllDishes() {
      return [...state.customDishes, ...INITIAL_DISHES];
    }

    function getDishPrice(dish) {
      if (Object.prototype.hasOwnProperty.call(state.priceOverrides, dish.id)) {
        return state.priceOverrides[dish.id];
      }
      return dish.price;
    }

    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById('toastBox');
      const txt = document.getElementById('toastText');
      txt.textContent = msg;
      box.classList.remove('hidden');
      box.classList.add('flex', 'toast-enter');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.add('hidden');
        box.classList.remove('flex', 'toast-enter');
      }, 2200);
    }

    function updateQty(dishId, delta) {
      const cur = state.cart[dishId] ? state.cart[dishId].qty : 0;
      const next = Math.max(0, cur + delta);
      if (next === 0) {
        delete state.cart[dishId];
      } else {
        state.cart[dishId] = {
          qty: next,
          note: state.cart[dishId] ? state.cart[dishId].note : ''
        };
      }
      state.clearConfirmPending = false;
      saveState();
      renderAll();
      if (state.detailDishId === dishId) {
        renderDetailModalContent();
      }
    }

    function quickAddByName(name) {
      const all = getAllDishes();
      let found = all.find(d => d.name === name);
      if (!found) {
        found = {
          id: 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          name: name,
          price: null,
          cat: 'cold_staple',
          zone: '自选加点',
          pos: '手动添加',
          py: ''
        };
        state.customDishes.unshift(found);
      }
      updateQty(found.id, 1);
      showToast('已加入：' + name);
    }

    function getCartStats() {
      const all = getAllDishes();
      const dishMap = new Map(all.map(d => [d.id, d]));
      let dishCount = 0;
      let totalPortions = 0;
      let knownSum = 0;
      let unpricedCount = 0;
      const orderedItems = [];
      const structure = { meat: 0, seafood: 0, veg: 0, cold_staple: 0 };

      for (const [id, entry] of Object.entries(state.cart)) {
        if (!entry || entry.qty <= 0) continue;
        const dish = dishMap.get(id);
        if (!dish) continue;
        dishCount += 1;
        totalPortions += entry.qty;
        const p = getDishPrice(dish);
        if (typeof p === 'number' && !isNaN(p)) {
          knownSum += p * entry.qty;
        } else {
          unpricedCount += 1;
        }
        if (dish.cat === 'seafood') structure.seafood += entry.qty;
        else if (dish.cat === 'veg' || dish.cat === 'homestyle') structure.veg += entry.qty;
        else if (dish.cat === 'cold_staple') structure.cold_staple += entry.qty;
        else structure.meat += entry.qty;

        orderedItems.push({ dish, qty: entry.qty, note: entry.note || '', effectivePrice: p });
      }
      return { dishCount, totalPortions, knownSum, unpricedCount, orderedItems, structure };
    }

    function formatStructureSummary(structure, dishCount) {
      if (dishCount === 0) return '';
      const segs = [];
      if (structure.meat > 0) segs.push(`${structure.meat} 荤/硬菜`);
      if (structure.seafood > 0) segs.push(`${structure.seafood} 水产`);
      if (structure.veg > 0) segs.push(`${structure.veg} 家常素蔬`);
      if (structure.cold_staple > 0) segs.push(`${structure.cold_staple} 凉菜/汤主食`);
      return '荤素搭配：' + segs.join(' · ');
    }

    function buildCopyText() {
      const { orderedItems } = getCartStats();
      if (orderedItems.length === 0) return '';

      const parts = orderedItems.map((item, idx) => {
        let piece = item.dish.name;
        if (state.copyIncludeQty && item.qty > 1) {
          piece += ' ×' + item.qty;
        }
        if (state.copyIncludeNotes && item.note.trim()) {
          piece += '（' + item.note.trim() + '）';
        }
        if (state.copyFormat === 'numbered') {
          return (idx + 1) + '. ' + piece;
        }
        return piece;
      });

      let body = state.copyFormat === 'inline' ? parts.join('、') : parts.join('\n');
      if (state.copyIncludeNotes && state.overallNote.trim()) {
        body += (state.copyFormat === 'inline' ? '（备注：' + state.overallNote.trim() + '）' : '\n备注：' + state.overallNote.trim());
      }
      return body;
    }

    async function copyDishNames() {
      const text = buildCopyText();
      if (!text) {
        showToast('请先选择至少一道菜品');
        return;
      }
      let copied = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (err) {
          copied = false;
        }
      }
      if (!copied) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          copied = document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (err) {
          copied = false;
        }
      }
      const { dishCount } = getCartStats();
      if (copied) {
        showToast('已复制 ' + dishCount + ' 道纯菜名（不含价格）');
      } else {
        openDrawer();
        const area = document.getElementById('copyPreviewArea');
        area.focus();
        area.select();
        showToast('已选中菜名文本，请按 Ctrl+C 或长按复制');
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      const all = getAllDishes();
      const catSelected = {};
      for (const d of all) {
        const q = state.cart[d.id] ? state.cart[d.id].qty : 0;
        if (q > 0) {
          catSelected[d.cat] = (catSelected[d.cat] || 0) + q;
          catSelected.all = (catSelected.all || 0) + q;
        }
      }

      container.innerHTML = CATEGORIES.map(cat => {
        const active = state.activeCategory === cat.id;
        const badgeCount = catSelected[cat.id] || 0;
        return `
          <button
            type="button"
            data-cat-id="${cat.id}"
            class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 border ${
              active
                ? 'bg-stone-900 text-amber-50 border-stone-900 shadow-sm'

            }"
          >
            <span>${escapeHtml(cat.label)}</span>
            ${badgeCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] font-bold ${active ? 'bg-[#e04f3a] text-white' : 'bg-[#fff5f2] text-[#c83e2b] border border-[#c83e2b]/20'}">${badgeCount}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function getFilteredDishes() {
      const q = state.searchQuery.trim().toLowerCase();
      return getAllDishes().filter(d => {
        if (state.activeCategory !== 'all' && d.cat !== state.activeCategory) return false;
        if (state.activeZone !== 'all' && d.zone !== state.activeZone) return false;
        const effPrice = getDishPrice(d);
        if (state.onlyPriced && (effPrice === null || effPrice === undefined)) return false;
        if (q) {
          const hay = (d.name + ' ' + (d.py || '') + ' ' + d.zone + ' ' + (d.pos || '')).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

              <div class="flex items-center gap-1.5 flex-wrap mb-1">
                <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-stone-100 text-stone-600">${escapeHtml(dish.pos || dish.zone)}</span>
                ${note ? `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-[#fff5f2] text-[#c83e2b]">${escapeHtml(note)}</span>` : ''}
              </div>
              <button type="button" data-open-detail="${dish.id}" class="font-serif-cn text-sm sm:text-[15px] font-bold text-stone-900 hover:text-[#c83e2b] text-left leading-snug break-words">${escapeHtml(dish.name)}</button>
              <div class="mt-1">
                ${
                  hasPrice
                    ? `<button type="button" data-edit-price="${dish.id}" class="text-sm font-bold text-[#c83e2b] hover:underline">¥${effPrice} <span class="text-[10px] font-normal text-stone-400">/例${isOverridden ? ' (已补)' : ''}</span></button>`
                    : `<button type="button" data-edit-price="${dish.id}" class="text-[11px] px-2 py-0.5 rounded bg-stone-100 hover:bg-stone-200 text-stone-500">价格未标清 · 点击补记</button>`
                }
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${qty > 0 ? `<button type="button" data-dec-id="${dish.id}" class="w-8 h-8 rounded-xl border border-stone-300 bg-white text-stone-700 font-bold">−</button><span class="w-5 text-center text-sm font-bold">${qty}</span>` : ''}
              <button type="button" data-inc-id="${dish.id}" class="w-8 h-8 rounded-xl btn-cinnabar text-white font-bold">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderBottomBarAndDrawer() {
      const { dishCount, totalPortions, knownSum, unpricedCount, orderedItems, structure } = getCartStats();

      const badge = document.getElementById('cartBadge');
      const title = document.getElementById('cartSummaryTitle');
      const sub = document.getElementById('cartSummarySub');
      const quickCopyBtn = document.getElementById('quickCopyBtn');
      const drawerCopyBtn = document.getElementById('drawerCopyBtn');
      const balanceHintBar = document.getElementById('balanceHintBar');
      const drawerStructureBar = document.getElementById('drawerStructureBar');

      if (dishCount === 0) {
        badge.classList.add('hidden');
        badge.classList.remove('flex');
        title.textContent = '暂未点菜';
        sub.textContent = '轻触菜品卡片 + 号即可加入点菜单';
        quickCopyBtn.disabled = true;
        drawerCopyBtn.disabled = true;
        balanceHintBar.textContent = '点菜贴士：点击菜品插画可放大预览并备注忌口；未标清价格支持店内随手补记';
        drawerStructureBar.classList.add('hidden');
      } else {
        badge.textContent = String(totalPortions);
        badge.classList.remove('hidden');
        badge.classList.add('flex');
        title.textContent = `已选 ${dishCount} 道菜（共 ${totalPortions} 份）`;
        sub.textContent = unpricedCount > 0
          ? `已知小计 ¥${knownSum} · 另含 ${unpricedCount} 道未标价菜`
          : `参考总计 ¥${knownSum} · 复制自动去价格`;
        quickCopyBtn.disabled = false;
        drawerCopyBtn.disabled = false;

        const structText = formatStructureSummary(structure, dishCount);
        balanceHintBar.textContent = structText;
        drawerStructureBar.textContent = structText;
        drawerStructureBar.classList.remove('hidden');
      }

      const clearBtn = document.getElementById('clearCartBtn');
      clearBtn.textContent = state.clearConfirmPending ? '再次点击确认清空' : '清空已点';
      clearBtn.className = state.clearConfirmPending
        ? 'px-2.5 py-1 rounded-lg text-xs font-bold bg-red-600 text-white transition'
        : 'px-2.5 py-1 rounded-lg text-xs font-medium text-red-700 hover:bg-red-50 transition';

      document.getElementById('drawerSubHeader').textContent =
        dishCount > 0 ? `共 ${dishCount} 道菜 / ${totalPortions} 份 · 复制文本严格不含价格` : '尚未选择菜品';

      const listEl = document.getElementById('cartItemsList');
      if (orderedItems.length === 0) {
        listEl.innerHTML = `
          <div class="py-10 text-center text-stone-400 text-xs bg-white rounded-2xl border border-dashed border-stone-200">
            点菜单空空如也，去挑几道招牌菜吧
          </div>
        `;
      } else {
        listEl.innerHTML = orderedItems.map(({ dish, qty, note, effectivePrice }) => `
          <div class="bg-white rounded-2xl p-3 border border-stone-200/80 shadow-sm">
            <div class="flex items-center justify-between gap-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-14 h-10 rounded-xl overflow-hidden shrink-0 border border-stone-200/70">${renderDishSvg(dish, 'cart')}</div>
                <div class="min-w-0">
                  <div class="font-serif-cn text-sm font-bold text-stone-900 truncate">${escapeHtml(dish.name)}</div>
                  <div class="text-[11px] text-stone-500">
                    ${typeof effectivePrice === 'number' ? `参考 ¥${effectivePrice * qty}` : '墙面未标清'}
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button type="button" data-dec-id="${dish.id}" class="w-7 h-7 rounded-lg border border-stone-300 bg-white text-stone-700 font-bold text-sm flex items-center justify-center">−</button>
                <span class="w-5 text-center text-xs font-bold text-stone-900">${qty}</span>
                <button type="button" data-inc-id="${dish.id}" class="w-7 h-7 rounded-lg btn-cinnabar text-white font-bold text-sm flex items-center justify-center">+</button>
              </div>
            </div>
            <div class="mt-2">
              <input
                type="text"
                data-note-id="${dish.id}"
                value="${escapeHtml(note)}"
                placeholder="单品口味备注（如：微辣、免葱、多醋）"
                class="w-full px-2.5 py-1 text-xs bg-stone-50 border border-stone-200 rounded-lg focus:bg-white focus:outline-none focus:border-[#c83e2b]"
              />
            </div>
          </div>
        `).join('');
      }

      document.querySelectorAll('.copy-fmt-btn').forEach(btn => {
        const active = btn.getAttribute('data-copy-fmt') === state.copyFormat;
        btn.className = 'copy-fmt-btn px-2.5 py-1 rounded-lg font-medium transition ' +
          (active ? 'bg-stone-900 text-white shadow-sm' : 'text-stone-600 hover:bg-stone-200/70');
      });

      document.getElementById('includeQtyCheckbox').checked = state.copyIncludeQty;
      document.getElementById('includeNoteCheckbox').checked = state.copyIncludeNotes;
      const overallInput = document.getElementById('overallNoteInput');
      if (document.activeElement !== overallInput) {
        overallInput.value = state.overallNote;
      }

      document.getElementById('copyPreviewArea').value =
        orderedItems.length > 0 ? buildCopyText() : '（选菜后此处实时生成纯菜名清单，自动剥离所有价格数字）';

      document.getElementById('drawerTotalAmount').textContent = `¥${knownSum}`;
      document.getElementById('drawerUnpricedHint').textContent =
        unpricedCount > 0 ? `另有 ${unpricedCount} 道菜墙面价格未标清，未计入参考总计` : '';
    }

    function renderAll() {
      renderCategoryTabs();
      renderDishGrid();
      renderBottomBarAndDrawer();
    }

    // Dish Detail Preview Modal Functions
    function openDetailModal(dishId) {
      state.detailDishId = dishId;
      renderDetailModalContent();
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
      state.detailDishId = null;
      document.getElementById('detailModal').classList.add('hidden');
    }

    function renderDetailModalContent() {
      const dish = getAllDishes().find(d => d.id === state.detailDishId);
      if (!dish) return;
      const qty = state.cart[dish.id] ? state.cart[dish.id].qty : 0;
      const note = state.cart[dish.id] ? state.cart[dish.id].note : '';
      const effPrice = getDishPrice(dish);
      const hasPrice = typeof effPrice === 'number' && !isNaN(effPrice);
      const catObj = CATEGORIES.find(c => c.id === dish.cat);

      document.getElementById('detailArtBox').innerHTML = renderDishSvg(dish, 'detail');
      document.getElementById('detailDishTitle').textContent = dish.name;
      document.getElementById('detailMetaBadges').innerHTML = `
        <span class="px-2 py-0.5 rounded-md bg-stone-200/80 text-stone-700 text-[11px] font-semibold">${escapeHtml(dish.pos || dish.zone)}</span>
        ${catObj ? `<span class="px-2 py-0.5 rounded-md bg-amber-100/90 text-amber-900 text-[11px] font-semibold">${escapeHtml(catObj.label)}</span>` : ''}
      `;
      document.getElementById('detailPriceArea').innerHTML = hasPrice
        ? `<div class="text-xl font-extrabold text-[#c83e2b]">¥${effPrice}<span class="text-xs font-normal text-stone-500">/例</span></div>`
        : `<div class="text-xs font-medium text-stone-400 bg-stone-100 px-2.5 py-1 rounded-lg">价格未标清</div>`;

      const noteInput = document.getElementById('detailNoteInput');
      if (document.activeElement !== noteInput) {
        noteInput.value = note;
      }

      document.getElementById('detailStepperBox').innerHTML = qty > 0
        ? `
          <button type="button" data-dec-id="${dish.id}" class="w-9 h-9 rounded-xl border border-stone-300 bg-white text-stone-800 font-bold text-lg flex items-center justify-center">−</button>
          <span class="w-7 text-center text-base font-bold text-stone-900">${qty}</span>
          <button type="button" data-inc-id="${dish.id}" class="w-9 h-9 rounded-xl btn-cinnabar text-white font-bold text-lg flex items-center justify-center">+</button>
        `
        : `
          <button type="button" data-inc-id="${dish.id}" class="px-5 py-2.5 rounded-xl btn-cinnabar text-white text-xs font-bold">+ 加入点菜单</button>
        `;
    }

    function openDrawer() {
      state.clearConfirmPending = false;
      renderBottomBarAndDrawer();
      document.getElementById('cartDrawer').classList.remove('hidden');
    }

    function closeDrawer() {
      state.clearConfirmPending = false;
      document.getElementById('cartDrawer').classList.add('hidden');
    }

    function openCustomDishModal() {
      state.modalMode = 'custom';
      document.getElementById('editModalTitle').textContent = '添加主食 / 自定义菜品';
      document.getElementById('customDishFields').classList.remove('hidden');
      document.getElementById('priceEditFields').classList.add('hidden');
      document.getElementById('customDishName').value = '';
      document.getElementById('customDishPrice').value = '';
      document.getElementById('editModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('customDishName').focus(), 50);
    }

    function openPriceEditModal(dishId) {
      const dish = getAllDishes().find(d => d.id === dishId);
      if (!dish) return;
      state.modalMode = 'price';
      state.editingDishId = dishId;
      document.getElementById('editModalTitle').textContent = '补充 / 修改参考单价';
      document.getElementById('customDishFields').classList.add('hidden');
      document.getElementById('priceEditFields').classList.remove('hidden');
      document.getElementById('priceEditDishLabel').textContent = '菜品：' + dish.name;
      const cur = getDishPrice(dish);
      document.getElementById('overridePriceInput').value = (typeof cur === 'number' && !isNaN(cur)) ? String(cur) : '';
      document.getElementById('editModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('overridePriceInput').focus(), 50);
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function confirmModalAction() {
      if (state.modalMode === 'custom') {
        const name = document.getElementById('customDishName').value.trim();
        const priceRaw = document.getElementById('customDishPrice').value.trim();
        if (!name) {
          showToast('请输入菜品或主食名称');
          return;
        }
        const parsedPrice = priceRaw !== '' ? Number(priceRaw) : null;
        const newDish = {
          id: 'custom_' + Date.now(),
          name: name,
          price: (parsedPrice !== null && !isNaN(parsedPrice) && parsedPrice >= 0) ? parsedPrice : null,
          cat: 'cold_staple',
          zone: '自选加点',
          pos: '手动添加',
          py: ''
        };
        state.customDishes.unshift(newDish);
        state.cart[newDish.id] = { qty: 1, note: '' };
        saveState();
        closeEditModal();
        renderAll();
        showToast('已添加并点选：' + name);
      } else if (state.modalMode === 'price' && state.editingDishId) {
        const raw = document.getElementById('overridePriceInput').value.trim();
        if (raw === '') {
          delete state.priceOverrides[state.editingDishId];
        } else {
          const val = Number(raw);
          if (!isNaN(val) && val >= 0) {
            state.priceOverrides[state.editingDishId] = val;
          }
        }
        saveState();
        closeEditModal();
        renderAll();
        if (state.detailDishId === state.editingDishId) {
          renderDetailModalContent();
        }
        showToast('单价已更新');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      renderAll();

      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderDishGrid();
      });

      document.getElementById('clearSearchBtn').addEventListener('click', () => {
        state.searchQuery = '';
        searchInput.value = '';
        renderDishGrid();
      });

      document.getElementById('zoneSelect').addEventListener('change', (e) => {
        state.activeZone = e.target.value;
        renderDishGrid();
      });

      document.getElementById('togglePricedBtn').addEventListener('click', () => {
        state.onlyPriced = !state.onlyPriced;
        renderDishGrid();
      });

      document.getElementById('toggleImgBtn').addEventListener('click', () => {
        state.showImages = !state.showImages;
        saveState();
        renderDishGrid();
      });

      document.getElementById('resetFiltersBtn').addEventListener('click', () => {
        state.activeCategory = 'all';
        state.activeZone = 'all';
        state.searchQuery = '';
        state.onlyPriced = false;
        document.getElementById('searchInput').value = '';
        document.getElementById('zoneSelect').value = 'all';
        renderAll();
      });

      document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;

        if (btn.hasAttribute('data-cat-id')) {
          state.activeCategory = btn.getAttribute('data-cat-id');
          renderAll();
          return;
        }
        if (btn.hasAttribute('data-inc-id')) {
          updateQty(btn.getAttribute('data-inc-id'), 1);
          return;
        }
        if (btn.hasAttribute('data-dec-id')) {
          updateQty(btn.getAttribute('data-dec-id'), -1);
          return;
        }
        if (btn.hasAttribute('data-quick-add')) {
          quickAddByName(btn.getAttribute('data-quick-add'));
          return;
        }
        if (btn.hasAttribute('data-edit-price')) {
          openPriceEditModal(btn.getAttribute('data-edit-price'));
          return;
        }
        if (btn.hasAttribute('data-open-detail')) {
          openDetailModal(btn.getAttribute('data-open-detail'));
          return;
        }
        if (btn.hasAttribute('data-detail-flavor')) {
          const flv = btn.getAttribute('data-detail-flavor');
          const id = state.detailDishId;
          if (!id) return;
          if (!state.cart[id]) {
            state.cart[id] = { qty: 1, note: flv };
          } else {
            const cur = (state.cart[id].note || '').trim();
            state.cart[id].note = cur ? (cur.includes(flv) ? cur : cur + '、' + flv) : flv;
          }
          saveState();
          renderAll();
          renderDetailModalContent();
          return;
        }
        if (btn.hasAttribute('data-copy-fmt')) {
          state.copyFormat = btn.getAttribute('data-copy-fmt');
          saveState();
          renderBottomBarAndDrawer();
          return;
        }
        if (btn.hasAttribute('data-overall-tag')) {
          const tag = btn.getAttribute('data-overall-tag');
          const cur = state.overallNote.trim();
          state.overallNote = cur ? (cur.includes(tag) ? cur : cur + '、' + tag) : tag;
          saveState();
          renderBottomBarAndDrawer();
        }
      });

      document.getElementById('detailNoteInput').addEventListener('input', (e) => {
        const id = state.detailDishId;
        if (!id) return;
        if (!state.cart[id]) {
          state.cart[id] = { qty: 1, note: e.target.value };
        } else {
          state.cart[id].note = e.target.value;
        }
        saveState();
        renderAll();
      });

      document.getElementById('detailEditPriceBtn').addEventListener('click', () => {
        if (state.detailDishId) openPriceEditModal(state.detailDishId);
      });

      document.getElementById('closeDetailModalBtn').addEventListener('click', closeDetailModal);
      document.getElementById('detailModalBackdrop').addEventListener('click', closeDetailModal);

      document.getElementById('cartItemsList').addEventListener('input', (e) => {
        const input = e.target;
        if (input && input.hasAttribute('data-note-id')) {
          const id = input.getAttribute('data-note-id');
          if (state.cart[id]) {
            state.cart[id].note = input.value;
            saveState();
            document.getElementById('copyPreviewArea').value = buildCopyText();
            renderDishGrid();
          }
        }
      });

      document.getElementById('overallNoteInput').addEventListener('input', (e) => {
        state.overallNote = e.target.value;
        saveState();
        const { orderedItems } = getCartStats();
        document.getElementById('copyPreviewArea').value =
          orderedItems.length > 0 ? buildCopyText() : '（选菜后此处实时生成纯菜名清单，自动剥离所有价格数字）';
      });

      document.getElementById('includeQtyCheckbox').addEventListener('change', (e) => {
        state.copyIncludeQty = e.target.checked;
        saveState();
        renderBottomBarAndDrawer();
      });

      document.getElementById('includeNoteCheckbox').addEventListener('change', (e) => {
        state.copyIncludeNotes = e.target.checked;
        saveState();
        renderBottomBarAndDrawer();
      });

      document.getElementById('openCartBtn').addEventListener('click', openDrawer);
      document.getElementById('openDrawerActionBtn').addEventListener('click', openDrawer);
      document.getElementById('closeCartBtn').addEventListener('click', closeDrawer);
      document.getElementById('cartBackdrop').addEventListener('click', closeDrawer);

      document.getElementById('quickCopyBtn').addEventListener('click', copyDishNames);
      document.getElementById('drawerCopyBtn').addEventListener('click', copyDishNames);

      document.getElementById('clearCartBtn').addEventListener('click', () => {
        const { dishCount } = getCartStats();
        if (dishCount === 0) return;
        if (!state.clearConfirmPending) {
          state.clearConfirmPending = true;
          renderBottomBarAndDrawer();
          return;
        }
        state.cart = {};
        state.overallNote = '';
        state.clearConfirmPending = false;
        saveState();
        renderAll();
        showToast('已清空已点菜品');
      });

      document.getElementById('openCustomModalBtn').addEventListener('click', openCustomDishModal);
      document.getElementById('cancelModalBtn').addEventListener('click', closeEditModal);
      document.getElementById('editModalBackdrop').addEventListener('click', closeEditModal);
      document.getElementById('confirmModalBtn').addEventListener('click', confirmModalAction);

      document.getElementById('customDishName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmModalAction();
      });
      document.getElementById('overridePriceInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmModalAction();
      });
    });
  </script>
</body>
</html>
